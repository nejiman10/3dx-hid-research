[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threedx-report10"
version = "0.6.2"
description = "Evidence-bounded Linux SDK for 3Dconnexion C658 Report 0x10"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "3dx-linux research project"}]
dependencies = []

[project.scripts]
c658-report10ctl = "threedx_report10.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
